# Builds the PicoDJ Windows installer (.msi) on GitHub's servers.
# Every push to main triggers a build; it can also be started by hand from the Actions tab ("Run workflow").
# Download the result from the run page → Artifacts → "PicoDJ-Windows-Installer".

name: Build PicoDJ for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (.msi)
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      BUILDENV_BASEPATH: C:\buildenv
      BUILDENV_RELEASE: TRUE
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CMake 3.21
        uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "3.21.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get build environment name
        shell: cmd
        run: tools\windows_buildenv.bat name

      - name: Cache prebuilt dependencies
        uses: actions/cache@v4
        with:
          path: C:\buildenv
          key: buildenv-${{ env.BUILDENV_NAME }}

      - name: Set up build environment (Qt + libraries from the Mixxx project)
        shell: cmd
        run: tools\windows_buildenv.bat setup

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBULK=ON -DFFMPEG=OFF -DHSS1394=ON -DLOCALECOMPARE=ON -DMAD=ON -DMEDIAFOUNDATION=ON `
            -DMODPLUG=ON -DQT6=ON -DWAVPACK=ON -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DWARNINGS_FATAL=OFF -DDEBUG_ASSERTIONS_FATAL=OFF -DDOWNLOAD_MANUAL=OFF -DBUILD_TESTING=OFF `
            -DBATTERY=ON -DBROADCAST=ON -DHID=ON -DKEYFINDER=ON -DLILV=ON -DOPUS=ON -DQTKEYCHAIN=ON -DVINYLCONTROL=ON `
            ..
        env:
          CC: cl
          CXX: cl

      - name: Build
        working-directory: build
        run: cmake --build . --config RelWithDebInfo
        env:
          CC: cl
          CXX: cl

      - name: Package (.msi)
        working-directory: build
        run: cpack -G WIX -C RelWithDebInfo

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PicoDJ-Windows-Installer
          path: build/*.msi
          if-no-files-found: error
          retention-days: 30
