[package]
name = "picodj"
version = "0.8.0"
description = "PicoDJ — DJ software for the home-made Raspberry Pi Pico controller"
authors = ["Nguyên"]
license = "GPL-2.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "picodj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
midir = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
